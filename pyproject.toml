[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "geofeed-tools"
version = "0.1.0"
description = "Tools for parsing, validating, normalizing, querying, and inspecting RFC 8805 geofeeds"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "gbe0", email = "git@gbe0.com" }]
dependencies = [
  "pycountry>=22.0.0",
]
keywords = [
  "geofeed",
  "rfc8805",
  "networking",
  "security",
]
classifiers = [
	'Environment :: Console',
	'Intended Audience :: System Administrators',
	'Intended Audience :: Telecommunications Industry',
	'Programming Language :: Python',
	'Programming Language :: Python :: 3.11',
	'Programming Language :: Python :: 3.12',
	'Programming Language :: Python :: 3.13',
	'Programming Language :: Python :: 3.14',
	'Topic :: Internet',
]

[project.urls]
Repository = 'https://github.com/python-modules/geofeed-tools'
Homepage = 'https://github.com/python-modules/geofeed-tools'
Issues = "https://github.com/python-modules/geofeed-tools/issues"

[project.optional-dependencies]
cli = [
  "typer>=0.12.0",
  "structlog>=24.0.0",
  "tabulate>=0.9.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-html>=4.1.0",
  "types-tabulate>=0.9.0",
]

[project.scripts]
geofeed-tools = "geofeed_tools.cli.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--html=reports/pytest-report.html --self-contained-html"
markers = [
  "integration: tests that make real network requests (deselect with '-m not integration')",
]
