name: Code Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      run_python:
        description: Run Python quality checks.
        required: false
        default: true
        type: boolean
      run_workflow:
        description: Run workflow quality checks.
        required: false
        default: true
        type: boolean
      run_docker:
        description: Run Docker quality checks.
        required: false
        default: true
        type: boolean
      run_security:
        description: Run security quality checks.
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      run_python:
        required: false
        default: true
        type: boolean
      run_workflow:
        required: false
        default: false
        type: boolean
      run_docker:
        required: false
        default: false
        type: boolean
      run_security:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Quality-Relevant Changes
    runs-on: ubuntu-latest
    outputs:
      workflow: ${{ steps.filter.outputs.workflow || 'false' }}
      docker: ${{ steps.filter.outputs.docker || 'false' }}

    steps:
      - name: Checkout
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'Makefile'
              - 'pyproject.toml'
              - '.github/workflows/publish-container-images.yml'

  python-quality:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || inputs.run_python }}
    uses: ./.github/workflows/quality-python.yml

  workflow-quality:
    needs: detect-changes
    if: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.detect-changes.outputs.workflow == 'true') || inputs.run_workflow }}
    uses: ./.github/workflows/quality-workflow.yml

  docker-quality:
    needs: detect-changes
    if: ${{ ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.detect-changes.outputs.docker == 'true') || inputs.run_docker }}
    uses: ./.github/workflows/quality-docker.yml

  security-quality:
    if: ${{ github.event_name == 'pull_request' || inputs.run_security }}
    uses: ./.github/workflows/quality-security.yml
