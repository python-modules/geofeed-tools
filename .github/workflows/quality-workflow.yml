name: Workflow Quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-quality:
    name: Workflow Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest