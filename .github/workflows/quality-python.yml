name: Python Quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run Ruff lint checks
        run: python -m ruff check src tests

      - name: Run ty checks
        run: python -m ty check src tests

      - name: Verify imports compile
        run: python -m compileall -q src tests

      - name: Run tests (excluding network integration)
        run: python -m pytest -q -m "not integration"