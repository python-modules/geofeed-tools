name: Shared Geofeed Validation

on:
  workflow_call:
    inputs:
      geofeed_path:
        description: Path or URL passed to geofeed-tools hook.
        required: true
        type: string
      python_version:
        description: Python version used for validation.
        required: false
        default: "3.13"
        type: string
      strict:
        description: Fail on warnings as well as errors.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  geofeed-validation:
    name: Geofeed validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install geofeed-tools CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install "geofeed-tools[cli]"

      - name: Validate geofeed
        shell: bash
        run: |
          if [[ "${{ inputs.strict }}" == "true" ]]; then
            geofeed-tools hook "${{ inputs.geofeed_path }}" --strict
          else
            geofeed-tools hook "${{ inputs.geofeed_path }}"
          fi