name: Publish Container Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push_images:
        description: Push the built container images to registries.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/python-modules/geofeed-tools
  DOCKERHUB_IMAGE: pythonmodules/geofeed-tools

jobs:
  quality:
    uses: ./.github/workflows/quality-checks.yml
    with:
      run_python: true
      run_workflow: true
      run_docker: true
      run_security: true

  publish:
    name: Build And Publish Images (${{ matrix.tag_name }})
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder_image: python:3-slim
            runtime_image: gcr.io/distroless/python3:nonroot
            tag_name: python3
            publish_latest: true
          - builder_image: python:3.11-slim
            runtime_image: gcr.io/distroless/python3-debian11:nonroot
            tag_name: python3.11
            publish_latest: false
          - builder_image: python:3.12-slim
            runtime_image: gcr.io/distroless/python3-debian12:nonroot
            tag_name: python3.12
            publish_latest: false
          - builder_image: python:3.13-slim
            runtime_image: gcr.io/distroless/python3-debian13:nonroot
            tag_name: python3.13
            publish_latest: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'release' || inputs.push_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'release' || inputs.push_images }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ matrix.tag_name }},enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=${{ github.ref_name }}-${{ matrix.tag_name }}
            type=semver,pattern={{version}}-${{ matrix.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}}-${{ matrix.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && matrix.publish_latest && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=geofeed-tools
            org.opencontainers.image.description=Tools for parsing, validating, normalizing, querying, and inspecting RFC 8805 geofeeds
            org.opencontainers.image.version-track=${{ matrix.tag_name }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            BUILDER_IMAGE=${{ matrix.builder_image }}
            RUNTIME_IMAGE=${{ matrix.runtime_image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' || inputs.push_images }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max