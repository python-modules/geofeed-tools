name: Security Quality

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-quality:
    name: Security Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,cli]" bandit

      - name: Run Bandit SAST scan
        run: python -m bandit -q -r src -s B101,B310